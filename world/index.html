
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私の見てる世界 | XBP</title>
  <link rel="stylesheet" href="../css/home.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f8f6;
      color: #333;
      font-family: "Noto Sans JP", sans-serif;
    }

    header {
      height: 80px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #333;
      text-decoration: none;
    }

    .back-home {
      color: #555;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .gallery-heading {
      text-align: center;
      padding: 100px 20px 80px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: #999;
    }

    .gallery-heading h1 {
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 5px;
      margin: 25px 0;
    }

    .gallery-heading p {
      color: #888;
      font-size: 14px;
      line-height: 2;
    }

    .photo-gallery {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 25px 100px;
    }

    .photo-item {
      margin-bottom: 100px;
    }

    .photo-number {
      font-size: 12px;
      letter-spacing: 3px;
      color: #999;
      margin-bottom: 15px;
    }

    .photo-item h2 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .photo-item img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .photo-description {
      font-size: 13px;
      color: #777;
      line-height: 2.2;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 35px;
      border-top: 1px solid #e5e5e5;
      color: #999;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      .gallery-heading {
        padding: 70px 15px 55px;
      }

      .gallery-heading h1 {
        font-size: 27px;
      }

      .photo-item {
        margin-bottom: 65px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="../index.html" class="logo">XBP</a>
    <a href="../index.html" class="back-home">← BACK TO HOME</a>
  </header>

  <main>
    <section class="gallery-heading">
      <p class="eyebrow">MY PHOTO COLLECTION</p>
      <h1>私の見てる世界</h1>
      <p>
        日常の中にある、何気ない景色。<br>
        自分の目で見つけた世界を写真に残す。
      </p>
    </section>

    <section class="photo-gallery">

      <article class="photo-item">
        <p class="photo-number">01 / NATURE</p>
        <h2>静かな時間</h2>
        <img src="../images/world1.jpg" alt="夕暮れの山と雲海">
        <p class="photo-description">
          自然の中で過ごす静かな時間。<br>
          目の前に広がる景色に、思わず足を止めた。
        </p>
      </article>

      <article class="photo-item">
        <p class="photo-number">02 / SKY</p>
        <h2>空の広がり</h2>
        <img src="../images/world2.jpg" alt="青空と草原">
        <p class="photo-description">
          どこまでも続いていくような青い空。<br>
          何気ない景色も、少し視点を変えると特別に見える。
        </p>
      </article>

      <article class="photo-item">
        <p class="photo-number">03 / SEA</p>
        <h2>海を眺めて</h2>
        <img src="../images/world3.jpg" alt="海を見渡す風景">
        <p class="photo-description">
          海を眺めながら、ゆっくりと流れる時間を楽しむ。<br>
          その瞬間にしか見られない景色を残していきたい。
        </p>
      </article>

    </section>
  </main>

  <footer>
    MY WORLD / XBP PORTFOLIO
  </footer>

</body>
</html>
